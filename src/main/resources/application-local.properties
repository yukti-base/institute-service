spring.application.name=institute-service
server.port=8086

# The SHARED database. institute was NOT split into its own database: keeping
# it here is what lets admin-service still join colleges and departments
# directly for posting targets and bulk student import.
spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# validate, not update: admin-service is the single DDL owner on this database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# No Redis in this service.
management.health.redis.enabled=false

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

