# Integration-test profile for institute-service.
#
# Throwaway database with ddl-auto=create-drop: the institute entities build
# their own schema and it is dropped at shutdown. The three tables this service
# reads but does not own are created by schema-foreign-tables.sql, which runs
# AFTER Hibernate thanks to defer-datasource-initialization.
spring.application.name=institute-service-test
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu_test
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-foreign-tables.sql
spring.jpa.defer-datasource-initialization=true

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service
